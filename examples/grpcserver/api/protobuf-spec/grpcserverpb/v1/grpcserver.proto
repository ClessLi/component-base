syntax = "proto3";

option go_package = "api/protobuf-spec/grpcserverpb/v1";
package grpcserverpb;  // service name

// Demo is the example service of the gRPC server, demonstrating both unary and
// server-streaming RPC shapes of the component-base generic gRPC server
// framework (mirroring bifrost's WebServerBinCMD.Exec and WebServerStatus.Get).
service Demo {
  // Echo unary RPC: echoes the request message, demonstrating the
  // transport -> endpoint -> middleware -> service -> store pipeline.
  rpc Echo(EchoRequest) returns (EchoResponse) {}
  // Download server-streaming RPC: sends data in ChunkSize chunks, demonstrating transport.StreamSendMsg.
  rpc Download(DownloadRequest) returns (stream Chunk) {}
}

message EchoRequest {
  string Message = 1;
}

message EchoResponse {
  string Message = 1;
}

message DownloadRequest {
  string Key = 1;
}

message Chunk {
  bytes Data = 1;
}